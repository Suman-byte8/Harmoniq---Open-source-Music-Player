name: backend
on:
  push:
    paths: ["harmoniq-backend/**"]
  pull_request:
    paths: ["harmoniq-backend/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harmoniq-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev
